# ============================================================
# CareStack Voice Periodontal Charting — Local Dev Stack
# Usage: docker compose up --build
# ============================================================

networks:
  carestack-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  # ──────────────────────────────────────────────────────────
  # Redis — Live chart state + Pub/Sub + Redis Streams queue
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: cs-redis
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - carestack-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────────────────────────────────
  # PostgreSQL — Persistent periodontal records + audit log
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cs-postgres
    environment:
      POSTGRES_DB:       carestack_charting
      POSTGRES_USER:     carestack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cs_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks:
      - carestack-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carestack -d carestack_charting"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ──────────────────────────────────────────────────────────
  # Voice Session Microservice (Go) — Core hot path
  # ──────────────────────────────────────────────────────────
  voice-session:
    build:
      context: ./services/voice-session
      dockerfile: Dockerfile
    container_name: cs-voice-session
    environment:
      PORT:             8080
      REDIS_URL:        redis://redis:6379
      POSTGRES_URL:     postgres://carestack:${POSTGRES_PASSWORD:-cs_dev_password}@postgres:5432/carestack_charting?sslmode=disable
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}         # empty = mock mode
      GROQ_API_KEY:     ${GROQ_API_KEY:-}             # empty = regex-only mode
      JWT_SECRET:       ${JWT_SECRET:-dev-jwt-secret-change-in-prod}
      ENV:              ${ENV:-development}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - carestack-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────
  # DB Writer Service (Go) — Kafka/Redis Streams → PostgreSQL
  # ──────────────────────────────────────────────────────────
  db-writer:
    build:
      context: ./services/db-writer
      dockerfile: Dockerfile
    container_name: cs-db-writer
    environment:
      REDIS_URL:    redis://redis:6379
      POSTGRES_URL: postgres://carestack:${POSTGRES_PASSWORD:-cs_dev_password}@postgres:5432/carestack_charting?sslmode=disable
      ENV:          ${ENV:-development}
      METRICS_PORT: "9091"
    ports:
      - "9091:9091"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - carestack-net
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # React Frontend (Vite dev server)
  # ──────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: cs-web
    environment:
      VITE_WS_URL: ws://localhost:80
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules      # prevent host node_modules override
    networks:
      - carestack-net
    depends_on:
      - voice-session

  # ──────────────────────────────────────────────────────────
  # Nginx — Reverse proxy (WSS routing + frontend)
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: cs-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - voice-session
      - web
    networks:
      - carestack-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
